[project]
name = "decoding-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.16"
dependencies = [
    "setuptools",
    "astroalign>=2.6.1",
    "csbdeep>=0.8.1",
    "diplib>=3.5.2",
    "itk-elastix",
    "numpy==1.26.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.1",
    "pip>=25.1.1",
    "psutil>=7.0.0",
    "pyqt6>=6.9.1",
    "pystackreg>=0.2.8",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "simpleitk>=2.5.2",
    "tifffile>=2025.5.10",
    "stardist",
    "scikit-learn",
    "tensorflow==2.8.0; platform_machine == 'AMD64'",
    "protobuf==3.20.0; platform_machine == 'AMD64'",
    "tensorflow-cpu==2.8.0; platform_machine == 'AMD64'",
    "tensorflow==2.16.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-macos==2.16.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-metal==1.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "llvmlite>=0.45.1",
    "pyinstaller>=6.18.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-qt>=4.2.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"    
]
