dependencies = [
   "astroalign==2.6.1",
    "diplib==3.5.2",
    "marsilea==0.5.6",
    "matplotlib==3.10.3",
    "numexpr==2.11.0",
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "pandas==2.3.0",
    "pillow==11.3.0",
    "plotly==6.2.0",
    "psutil==7.0.0",
    "pyclesperanto==0.18.3",
    "pyqt6==6.9.1",
    "pyqt6-qt6==6.9.1",
    "pyqt6-sip==13.10.2",
    "pyqtgraph==0.13.7",
    "pystackreg==0.2.8",
    "qtrangeslider==0.1.5",
    "scanpy[leiden]==1.11.5",
    "scikit-image==0.24.0",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "simpleitk==2.5.2",
    "sklearn-ann==0.1.4",
    "stardist>=0.9.1",
    "tensorflow==2.8.0; platform_machine == 'AMD64'",
    "protobuf==3.20.0; platform_machine == 'AMD64'",
