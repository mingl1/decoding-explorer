name: PyInstaller Build

on:
  push:
    branches:
      - main
      - newer

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "uv"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install Visual C++ Redistributable
        if: runner.os == 'Windows'
        run: choco install vcredist2013 vcredist2015 -y

      - name: Install dependencies (uv sync)
        run: |
          uv sync --frozen

      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller main.py \
            --onedir \
            --windowed \
            --name "Decoding-Explorer" \
            --add-data "assets:assets" \
            --icon ./assets/final_icon.png \
            --collect-submodules="scikit-learn" \
            --collect-submodules="stardist" \
            --hidden-import="metadata" \
            --copy-metadata scanpy \
            --copy-metadata scikit-learn

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller main.py `
            --onefile `
            --windowed `
            --name "Decoding-Explorer" `
            --add-data "assets;assets"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/*
